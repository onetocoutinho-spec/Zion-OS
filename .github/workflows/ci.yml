# CI mínimo do Zion OS — PR-001 (EPIC E1.1).
#
# Gate de qualidade em todo push no master e em todo pull request:
#   typecheck (tsc --noEmit) + suíte completa (node:test via tsx).
#
# Node 22 LTS por decisão do programa (alinhamento com produção/Vercel;
# a versão local da máquina de dev NÃO é referência arquitetural).
#
# Lint promovido ao gate no PR-005 (E1.1.4): zero erros no código do app
# (os "9 erros" eram vazamento de escopo — plugin minificado do Obsidian).
# Warnings são tolerados (eslint retorna 0 com warnings-only).

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Os TESTES também são type-checkados, e por um motivo medido: um contrato
      # ganhou campo obrigatório, o fixture ficou inválido, `tsc` seguiu VERDE e
      # três testes só quebraram em runtime (ver o cabeçalho de tsconfig.test.json).
      # O passo existia no `npm run gate` e não aqui — então a checagem rodava só
      # na máquina de quem lembrasse, e treze erros sobreviveram no master.
      - name: Typecheck dos testes
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test
